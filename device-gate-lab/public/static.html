<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <link href="/favicon.ico" rel="icon">
  <meta content="no-referrer" name="referrer"/>
  <meta content="noindex, nofollow, noarchive" name="robots"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>Service</title>
  <style>
    html{margin:0;min-height:100vh;background:#fff}
    /* ⚠️ 关键：没有 wa-ok 就白屏 */
    html:not(.wa-ok) body{visibility:hidden!important;margin:0;min-height:100vh}
    body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#e5ddd5;margin:0}
    .top{background:#075e54;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
    .logo{width:38px;height:38px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:20px}
    .name{font-weight:600;font-size:16px}
    .sub{font-size:12px;opacity:.8}
    .chat{padding:20px 16px;max-width:640px;margin:0 auto}
    .bubble{background:#fff;border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.1);font-size:14px;line-height:1.7}
    .bubble .t{font-size:11px;color:#999;margin-top:8px}
    .flag{background:#e8f5e9;border:2px dashed #2e7d32;color:#1b5e20;font-family:Consolas,monospace;
          padding:14px;border-radius:8px;margin:16px 0;font-size:14px;word-break:break-all}
    .row{display:flex;gap:8px;margin-top:10px}
    input{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    button{padding:10px 18px;background:#075e54;color:#fff;border:0;border-radius:6px;cursor:pointer}
    .log{margin-top:18px;background:#1e1e1e;color:#9cdcfe;font-family:Consolas,monospace;font-size:12px;
         padding:12px;border-radius:6px;white-space:pre-wrap;max-height:220px;overflow:auto}
  </style>
</head>
<body>

<div class="top">
  <div class="logo">✆</div>
  <div>
    <div class="name">WhatsApp</div>
    <div class="sub">網絡正常 · 客服服務可用</div>
  </div>
</div>

<div class="chat">
  <div class="bubble">
    你好，WhatsApp 安全檢測中心，很高興為你服務！
    <div class="t">系統訊息</div>
  </div>

  <div class="bubble" id="gate-bubble">
    ⏳ 正在驗證裝置…
    <div class="t">如果你看到這行字，說明你已經過了第 1 關</div>
  </div>

  <div id="flag1-slot"></div>

  <div class="bubble">
    <b>驗證電話號碼</b><br>
    請輸入電話號碼，我們會向你發送連結請求。
    <div class="row">
      <input id="phone" placeholder="請輸入電話號碼" type="tel"/>
      <button onclick="fakeSubmit()">提交</button>
    </div>
    <div class="t">這是靶場，提交什麼都不會發生</div>
  </div>

  <div class="log" id="log">[靶场日志]</div>
</div>

<script src="/kv5Mjg/mgate.js"></script>
<script src="/kv5Mjg/app.js"></script>
</body>
</html>
